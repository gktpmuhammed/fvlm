model:
  arch: blip_pretrain_vit
  model_type: 'fvlp'
  vit_model: 'base'
  vit_rand_patches: True
  vit_drop_path_rate: 0.1
  load_finetuned: False
  load_pretrained: True
  pretrained: "/home/muhammedg/fvlm/checkpoints/model.pth" 

datasets:
  report_generation:
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

run:
  task: report_generation
  
  # generation parameters
  num_beams: 3
  max_length: 500
  min_length: 10

  # Test settings - minimal training
  batch_size_train: 2
  batch_size_eval: 4
  max_epoch: 10
  
  # Checkpoint saving settings
  save_freq: 2  # Save checkpoint every 50 iterations
  
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 10  # Reduced warmup steps

  optimizer:
    opt: adamW
    lr: 1e-5
    weight_decay: 0.05

  seed: 42
  output_dir: "output/BLIP/Report_Generation_Test"

  amp: True
  resume_ckpt_path: null
  num_workers: 2  # Reduced workers

  evaluate: False  # Disable evaluation to focus on training and checkpoint saving
  train_splits: ["train"]
  # valid_splits: ["val"]  # Remove validation to force checkpoint saving every epoch

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False  # Disable distributed training for test
