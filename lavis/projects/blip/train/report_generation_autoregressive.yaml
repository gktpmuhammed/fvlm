model:
  arch: blip_report_generation
  model_type: 'base'
  load_finetuned: False
  load_pretrained: True
  pretrained: "/home/muhammedg/fvlm/checkpoints/model.pth"
  
  # BERT config for BiomedVLP tokenizer
  med_config_path: "BiomedVLP-CXR-BERT-specialized/config.json"
  
  # Text generation parameters
  max_txt_len: 512
  
  # AUTOREGRESSIVE TRAINING - matches inference behavior
  use_autoregressive_training: true

datasets:
  report_generation:
    data_type: images
    build_info:
      annotations:
        train:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/train_reports.csv
        val:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/validation_reports.csv
      images:
        storage: /home/muhammedg/fvlm/data/
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

run:
  task: report_generation
  
  # Generation parameters - optimized for medical reports
  use_nucleus_sampling: true
  num_beams: 1
  max_length: 512
  min_length: 25
  top_p: 0.9
  repetition_penalty: 1.2

  # Training parameters - adjusted for autoregressive training
  batch_size_train: 1  # Smaller batch due to sequential computation
  batch_size_eval: 2
  max_epoch: 5  # Fewer epochs to prevent overfitting

  # Learning rate schedule - higher LR for autoregressive training
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 5e-5  # Higher than teacher forcing
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 500  # Shorter warmup

  # Optimizer
  optimizer:
    opt: adamW
    lr: 5e-5
    weight_decay: 0.05

  # System settings
  seed: 42
  output_dir: "/home/muhammedg/fvlm/outputs/BLIP/Report_Generation_Autoregressive"
  amp: True
  resume_ckpt_path: null
  num_workers: 4
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False

  # Training mode settings
  evaluate: False
  train_splits: ["train"]
  
  # Checkpoint and logging settings
  save_freq: 1  # Save every epoch
  log_freq: 100  # More frequent logging for autoregressive
  eval_freq: 1
