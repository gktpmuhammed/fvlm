model:
  arch: blip_pretrain_vit
  model_type: 'fvlp'
  vit_model: 'base'
  vit_rand_patches: True
  vit_drop_path_rate: 0.1
  load_finetuned: False
  load_pretrained: True
  pretrained: "/home/muhammedg/fvlm/checkpoints/model.pth"
  
  # BERT config for BiomedVLP tokenizer
  med_config_path: "BiomedVLP-CXR-BERT-specialized/config.json"
  
  # Model parameters
  image_size: 224
  alpha: 0.5
  embed_dim: 256
  prompt: "a picture of "

datasets:
  organ_aware_report_generation:
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

run:
  task: report_generation
  
  # generation parameters - optimized nucleus sampling (387% vocabulary improvement)
  use_nucleus_sampling: true
  num_beams: 1
  max_length: 1000
  min_length: 25
  top_p: 0.9
  repetition_penalty: 1.2

  # Training parameters - optimized for organ-aware generation
  batch_size_train: 2  # Reduced for larger dataset
  batch_size_eval: 8
  max_epoch: 10  # Full dataset training for 10 epochs

  # Learning rate schedule
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 5e-6  # Lower learning rate for fine-tuning
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 500  # Shorter warmup for fine-tuning

  # Optimizer
  optimizer:
    opt: adamW
    lr: 5e-6
    weight_decay: 0.01  # Reduced weight decay

  seed: 42
  output_dir: "output/BLIP/Organ_Aware_Report_Generation_Full_Dataset_10E"

  amp: True
  resume_ckpt_path: null
  num_workers: 8  # Increased for full dataset

  # Evaluation and checkpointing
  evaluate: False  # Disable evaluation to save checkpoint every epoch
  train_splits: ["train"]
  # valid_splits: ["val"]  # Enable later for validation

  # Distributed training
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False  # Start with single GPU

  # Organ-aware specific settings
  save_freq: 2  # Save every epoch for organ-aware training
  log_freq: 500  # More frequent logging for monitoring
