model:
  arch: blip_report_generation
  model_type: 'base'
  load_finetuned: False
  load_pretrained: True
  pretrained: "/home/muhammedg/fvlm/checkpoints/model.pth"
  
  # BERT config for BiomedVLP tokenizer
  med_config_path: "BiomedVLP-CXR-BERT-specialized/config.json"
  
  # Text generation parameters
  max_txt_len: 512

datasets:
  report_generation:
    data_type: images
    build_info:
      annotations:
        train:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/train_reports.csv
        val:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/validation_reports.csv
      images:
        storage: /home/muhammedg/fvlm/data/
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

run:
  task: report_generation
  
  # generation parameters - optimized for medical reports
  use_nucleus_sampling: true
  num_beams: 1
  max_length: 512
  min_length: 25
  top_p: 0.9
  repetition_penalty: 1.2

  batch_size_train: 2
  batch_size_eval: 2
  max_epoch: 10  # Fewer epochs to prevent overfitting

  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 1000

  optimizer:
    opt: adamW
    lr: 1e-5
    weight_decay: 0.05

  seed: 42
  output_dir: "output/BLIP/Report_Generation_Simple"

  amp: True
  resume_ckpt_path: null
  num_workers: 4

  evaluate: False
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False

  # Report generation specific settings
  save_freq: 2
  log_freq: 500
