model:
  arch: blip_report_generation
  model_type: 'base'
  load_finetuned: False
  load_pretrained: True
  pretrained: "/home/muhammedg/fvlm/checkpoints/model.pth"
  
  # BERT config for BiomedVLP tokenizer
  med_config_path: "BiomedVLP-CXR-BERT-specialized/config.json"
  
  # Text generation parameters
  max_txt_len: 512

datasets:
  report_generation:
    data_type: images
    build_info:
      annotations:
        train:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/train_reports.csv
        val:
          storage: /home/muhammedg/fvlm/data/dataset/radiology_text_reports/validation_reports.csv
      images:
        storage: /home/muhammedg/fvlm/data/
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

run:
  task: report_generation
  
  # Generation parameters - optimized for medical reports
  use_nucleus_sampling: true
  num_beams: 1
  max_length: 512
  min_length: 25
  top_p: 0.9
  repetition_penalty: 1.2

  # Training parameters
  batch_size_train: 2
  batch_size_eval: 2
  max_epoch: 10

  # Learning rate schedule
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 1000

  # Optimizer
  optimizer:
    opt: adamW
    lr: 1e-5
    weight_decay: 0.05

  # System settings
  seed: 42
  output_dir: "/home/muhammedg/fvlm/outputs/BLIP/Report_Generation"
  amp: True
  resume_ckpt_path: null
  num_workers: 4
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False

  # Training mode settings
  evaluate: False  # False = run training, True = skip training (evaluation only)
  train_splits: ["train"]
  # valid_splits: ["val"]  # Disabled to use regular epoch-based checkpoint saving
  
  # Checkpoint and logging settings
  save_freq: 1  # Save every epoch
  log_freq: 500  # Log every 500 steps
  eval_freq: 1   # Run validation every epoch (when enabled)

# Training profiles for different use cases
# Uncomment the desired profile or modify settings above

# PROFILE: Quick Test (2 epochs, small batch)
# max_epoch: 2
# batch_size_train: 1
# log_freq: 10
# output_dir: "/home/muhammedg/fvlm/outputs/BLIP/Report_Generation_Test"

# PROFILE: Full Training (20 epochs, validation enabled)
# max_epoch: 20
# valid_splits: ["val"]
# evaluate: False
# output_dir: "/home/muhammedg/fvlm/outputs/BLIP/Report_Generation_Full"

# PROFILE: Evaluation Only (no training)
# evaluate: True
# resume_ckpt_path: "/home/muhammedg/fvlm/outputs/BLIP/Report_Generation/latest/checkpoint_best.pth"
